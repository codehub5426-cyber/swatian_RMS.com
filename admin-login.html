<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - School RMS</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="main">

    <!-- NAVBAR -->
    <div class="navbar">

        <img src="logo.png" class="logo">

        <div class="hamburger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>

        <div class="menu" id="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="results.html">Result</a></li>
                <li><a href="student-login.html">Login</a></li>
                <li><a href="admin-login.html" class="active">Admin</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>

    </div>

    <!-- ADMIN LOGIN -->
    <div class="content">

        <div class="login-card">

            <h1>Admin Login</h1>

            <div class="input-box">
                <i class="fa fa-user-shield"></i>
                <input type="text" id="adminUser" placeholder="Admin Username">
            </div>

            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" id="adminPass" placeholder="Admin Password">
            </div>

            <button class="btn" onclick="adminLogin()">Login</button>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>© 2026 School RMS</p>
    </div>

</div>

<script>
function adminLogin(){

    let username = document.getElementById("adminUser").value;
    let password = document.getElementById("adminPass").value;

    if(username === "admin" && password === "12345"){

        localStorage.setItem("adminLoggedIn","true");

        window.location.href = "admin.html";
    }
    else{
        alert("Invalid Username or Password");
    }
}
</script>

</body>
</html>
